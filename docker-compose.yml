services:
  telerelay:
    container_name: telerelay
    image: ghcr.io/journey-ad/telerelay:latest
    build: .
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:${WEB_PORT:-8080}"
    volumes:
      - ./.env:/app/.env
      - ./config:/app/config
      - ./data:/app/data
      - ./logs:/app/logs
    env_file:
      - .env
    environment:
      - TZ=Asia/Shanghai
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import os, urllib.request; port = os.getenv('WEB_PORT', '8080'); urllib.request.urlopen(f'http://127.0.0.1:{port}/api/v1/health', timeout=3)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
